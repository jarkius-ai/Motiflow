    require:
      - current_readiness_references
      - MEOS/06_DEFINITION_OF_READY.md
      - MEOS/13_REVIEW_STANDARD.md
  architecture_change:
    roles: [chief_architect, reviewer]
    require:
      - MASTER_CONTEXT.md
      - docs/00-foundation/ARCHITECTURE_CHANGE_GATE.md
      - MEOS/11_ARCHITECTURE_RULES.md
      - MEOS/14_ADR_PROCESS.md
      - affected_architecture
      - applicable_adrs
  future_capability_change:
    roles: [product_owner, chief_architect, reviewer]
    require:
      - PROJECT_CHARTER.md
      - MASTER_CONTEXT.md
      - future_platform_references
      - docs/00-foundation/ARCHITECTURE_CHANGE_GATE.md
  contract_change:
    roles: [chief_architect, implementer, reviewer, qa]
    require:
      - current_contract
      - proposed_contract
      - compatibility_classification
      - migration_and_rollback
  external_provider_change:
    roles: [chief_architect, security_reviewer, implementer, reviewer, qa]
    require:
      - capability_contract
      - provider_comparison
      - threat_model
      - credential_and_data_policy
      - disablement_and_replacement_plan
      - ready_task
  browser_authenticated_or_proxy_change:
    roles: [product_owner, chief_architect, security_reviewer, reviewer, qa]
    require:
      - explicit_product_need
      - legal_and_platform_policy_review
      - threat_model
      - accepted_adr_or_policy
      - ready_task
      - independent_verification
  product_change:
    roles: [product_owner, reviewer]
    require:
      - PROJECT_CHARTER.md
      - affected_product_requirements
      - product_evidence
  release:
    roles: [release_manager, reviewer, qa]
    require:
      - MEOS/15_GOLDEN_PATH.md
      - quality_gate_report
      - release_notes
      - migration_and_rollback_plan
      - monitoring_plan
      - human_authorization

routing_rules:
  task_must_declare_role: true
  task_must_declare_review_roles: true
  task_must_declare_references: true
  task_must_declare_artifact_contracts: true
  identify_canonical_owner_before_edit: true
  use_minimum_complete_context: true
  archived_sources_are_non_authoritative: true
  loose_blueprint_is_non_authoritative: true
  missing_or_conflicting_context: stop_and_escalate
  architecture_trigger_requires_adr_review: true
  target_blueprint_does_not_authorize_implementation: true
  roadmap_does_not_authorize_implementation: true
  capability_state_requires_repository_evidence: true
  future_phase_requires_activation_gate: true
  provider_name_does_not_mean_provider_selection: true
  browser_or_proxy_requires_explicit_high_risk_gate: true
  completion_requires_quality_gate: true
  release_requires_golden_path: true
  release_requires_human_authority: true
  score_cannot_override_failed_gate: true
