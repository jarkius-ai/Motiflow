version: 5
status: active
owner: Chief Architect
release: pre-implementation-readiness

repository_state:
  current_branch: main
  default_branch: main
  remote_head: fa0f22d
  merged_pull_requests: [1, 2, 3, 4]
  implementation_status: not_started

current_milestone: phase-4a-pre-implementation-readiness
current_focus:
  - translate accepted documentation and architecture into the first implementation-ready task specification
  - preserve canonical repository boundaries and avoid speculative structure before code exists
next_priorities:
  - scope provider-neutral Model Gateway contracts with supporting schemas and contract tests
  - define the verification path for the first executable slice before implementation begins
  - introduce only the canonical directories required by the first real implementation change

identity:
  product: Motiflow
  product_architecture: ACDS
  engineering_governance: MEOS

bootstrap:
  entrypoint: START_HERE.md
  foundation_read_order:
    - PROJECT_CHARTER.md
    - MASTER_CONTEXT.md
    - CONTEXT_INDEX.yaml
    - MEOS/20_PROJECT_BOOTSTRAP.md
  governance_references:
    - docs/00-foundation/DOCUMENT_AUTHORITY.md
    - docs/00-foundation/TERMINOLOGY.md
    - docs/00-foundation/REPOSITORY_STRUCTURE.md
    - docs/00-foundation/MIGRATION_PLAN.md
    - docs/00-foundation/DOCUMENTATION_QUALITY_CHECKLIST.md
  engineering_baseline:
    - MEOS/01_ENGINEERING_CONSTITUTION.md
    - MEOS/02_AI_CONSTITUTION.md
    - MEOS/03_CONTEXT_STRATEGY.md
    - MEOS/19_AI_WORKFORCE_CHARTER.md
    - MEOS/roles.yaml
    - MEOS/05_TASK_SPECIFICATION.md
    - MEOS/06_DEFINITION_OF_READY.md
    - MEOS/11_ARCHITECTURE_RULES.md
    - MEOS/15_GOLDEN_PATH.md

mandatory_completion_context:
  - MEOS/10_QUALITY_GATE.md
  - MEOS/15_GOLDEN_PATH.md

role_registry: MEOS/roles.yaml
workforce_charter: MEOS/19_AI_WORKFORCE_CHARTER.md
golden_path: MEOS/15_GOLDEN_PATH.md
architecture_rules: MEOS/11_ARCHITECTURE_RULES.md
adr_process: MEOS/14_ADR_PROCESS.md
artifact_contracts: docs/02-architecture/DATA_CONTRACTS.md

roles:
  chief_architect:
    required: [MEOS/11_ARCHITECTURE_RULES.md, MEOS/14_ADR_PROCESS.md, docs/02-architecture/**, docs/adr/**, docs/01-product/**]
  product_owner:
    required: [docs/00-foundation/**, docs/01-product/**]
  backend:
    required: [docs/02-architecture/**, docs/03-engineering/**, docs/01-product/**]
  frontend:
    required: [docs/01-product/**, docs/02-architecture/**, docs/03-engineering/**, docs/05-design/**]
  ai_engineer:
    required: [docs/04-ai/**, docs/02-architecture/**, docs/01-product/**]
  qa:
    required: [task_specification, acceptance_criteria, affected_contracts, implementation_and_tests]
  security_reviewer:
    required: [affected_architecture, data_contracts, threat_models, implementation_diff]
  reviewer:
    required: [task_specification, context_manifest, implementation_diff, test_results, affected_docs_and_contracts]
  documentation:
    required: [changed_artifacts, controlling_requirements, architecture_decisions]
  release_manager:
    required: [quality_gate_report, test_results, migration_and_rollback_plan, release_notes, monitoring_plan]

task_routing:
  architecture_change:
    roles: [chief_architect, reviewer]
    require: [MEOS/11_ARCHITECTURE_RULES.md, MEOS/14_ADR_PROCESS.md, docs/02-architecture/**, docs/adr/**]
  product_change:
    roles: [product_owner, reviewer]
    require: [docs/01-product/**]
  backend_change:
    roles: [backend, reviewer, qa]
    require: [affected_api_contracts, affected_data_contracts, affected_tests]
  frontend_change:
    roles: [frontend, reviewer, qa]
    require: [affected_user_journey, affected_design_contract, affected_api_contracts]
  ai_change:
    roles: [ai_engineer, reviewer, qa]
    require: [affected_ai_contracts, evaluation_criteria, safety_and_cost_constraints]
  security_sensitive_change:
    roles: [security_reviewer, reviewer, qa]
    require: [threat_model, affected_data_flows, security_tests]
  contract_change:
    roles: [chief_architect, implementer, reviewer, qa]
    require: [current_contract, proposed_contract, compatibility_classification, migration_and_rollback]
  release:
    roles: [release_manager, qa, reviewer]
    require: [MEOS/15_GOLDEN_PATH.md, quality_gate_report, release_notes, migration_and_rollback_plan, monitoring_plan, human_authorization]

routing_rules:
  default: bootstrap
  task_must_declare_role: true
  task_must_declare_review_roles: true
  task_must_declare_references: true
  task_must_declare_artifact_contracts: true
  use_minimum_complete_context: true
  archived_sources_are_non_authoritative: true
  missing_or_conflicting_context: stop_and_escalate
  architecture_trigger_requires_adr_review: true
  completion_requires_quality_gate: true
  release_requires_golden_path: true
  release_requires_human_authority: true
  score_cannot_override_failed_gate: true
